name: Build and release foto RC

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foto-rc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
            python_arch: x64

          - target: linux-amd64
            runner: ubuntu-24.04
            python_arch: x64

          - target: linux-arm64
            runner: ubuntu-24.04-arm
            python_arch: arm64

          - target: macos-arm64
            runner: macos-15
            python_arch: arm64

          - target: macos-amd64
            runner: macos-15-intel
            python_arch: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Linux build-host GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-build.txt
          python -m pip check

      - name: Check Python syntax
        run: >
          python -m py_compile
          foto_rc.py
          launcher.py
          release_entry.py
          scripts/build_release.py
      - name: Install macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          
          : "${BUILD_CERTIFICATE_BASE64:?Missing BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD}"
                                                                                                            
          CERTIFICATE_PATH="$RUNNER_TEMP/build-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
                                                                                                                                
          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode > "$CERTIFICATE_PATH"
                                                                                                                                                      
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                                                                                                                                                                            
          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN_PATH"
                                                                                                                                                                                                  
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          
          # Install Apple's public Developer ID intermediate certificate.
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            
          security add-certificates \
            -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                      
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | tee "$RUNNER_TEMP/signing-identities.txt"
          
          grep -F \
            'Developer ID Application: Owen Edwards (5QQP2F82BF)' \
            "$RUNNER_TEMP/signing-identities.txt"
          
          rm -f "$CERTIFICATE_PATH"
          
      - name: Build, test, and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'test' }}
          MACOS_SIGNING_IDENTITY: "Developer ID Application: Owen Edwards (5QQP2F82BF)"
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: python scripts/build_release.py

      - name: Upload packaged files
        uses: actions/upload-artifact@v7
        with:
          name: foto-RC-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Clean up macOS signing credentials
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/app-signing.keychain-db" || true

          rm -f \
            "$RUNNER_TEMP/build-certificate.p12" \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  publish:
    name: Publish GitHub Release
    needs: build

    # Manual runs build downloadable test artifacts, but do not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download all packaged builds
        uses: actions/download-artifact@v8
        with:
          pattern: foto-RC-*
          path: release
          merge-multiple: true

      - name: Validate assets and generate checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          folder = Path("release")
          archives = (
              list(folder.glob("*.zip"))
              + list(folder.glob("*.tar.gz"))
          )

          if len(archives) != 5:
              raise RuntimeError(
                  f"Expected five application archives, got {len(archives)}"
              )

          files = sorted(
              path for path in folder.iterdir()
              if path.is_file() and path.name != "SHA256SUMS.txt"
          )

          lines = []
          for path in files:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(
                      lambda: stream.read(1024 * 1024), b""
                  ):
                      digest.update(chunk)

              lines.append(f"{digest.hexdigest()}  {path.name}\n")

          (folder / "SHA256SUMS.txt").write_text(
              "".join(lines),
              encoding="utf-8",
          )
          PY

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## foto RC

          Download the archive matching your operating system and CPU.
          Python and the application's Python dependencies are bundled.

          - Windows: extract the entire ZIP, then open foto-RC.exe.
          - macOS: extract the ZIP, then move foto-RC.app to Applications.
          - Linux: extract the TAR.GZ, then run foto-RC.

          Keep the Windows/Linux executable together with its bundled files.

          Linux builds target Ubuntu 24.04-class desktop systems.
          macOS builds are built and smoke-tested on macOS 15.

          macOS builds are Developer ID signed and notarized by Apple.
          Windows builds are not publisher-signed; Windows security 
          warnings or restrictions may apply.


          SHA256SUMS.txt contains download checksums.
          The dependencies files record the build environments.

          Choose an application archive, not GitHub's automatic
          "Source code" downloads.
          EOF

      - name: Create draft, upload assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"

            if [ "$IS_DRAFT" != "true" ]; then
              echo "This release is already published. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "foto RC $TAG" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
